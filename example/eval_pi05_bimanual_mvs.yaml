      "enable_auto_white_balance": true,
      "black_level_enable": true,
      "black_level": 240,
      "brightness": 40,
      "sensor_roi": {
        "enabled": true,
        "offset_x": 720,
        "offset_y": 720,
        "width": 1080,
        "height": 1080
      },
      "receive_latency": 0.0,
      "sdk_path": "/opt/MVS/Samples/64/Python/MvImport",
      "sdk_runtime": "/opt/MVS/lib",
      "launch_timeout": 15,
      "frame_timeout_ms": 1000,
      "recording_codec": "libx264"
