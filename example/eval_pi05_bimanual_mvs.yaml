  # Robot order: 0 -> right, 1 -> left. robot_ip is the NUC address.
  "robots": [
    {
      "robot_type": "franka",
      "robot_ip": null, # TODO: fill hardware identifier
      "robot_port": null, # TODO: fill hardware identifier
